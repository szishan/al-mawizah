<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Studio | Al Mawizah</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">AL MAWIZAH <small>ADMIN STUDIO</small></a><a href="index.html">View shop</a></header><main class="section" style="max-width:900px;margin:auto"><span class="eyebrow">PRIVATE MANAGEMENT</span><h1 style="font-size:50px">Admin Studio</h1><p>Sign in with an authorized Supabase administrator account. Products are only public when published.</p><p id="status"></p><form id="login"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="gold-button">Sign in</button></form><section id="studio" hidden><button id="logout" class="outline">Sign out</button><h2>Product editor</h2><form id="editor"><input type="hidden" name="id"><label>English name<input name="name_en" required></label><label>বাংলা নাম<input name="name_bn"></label><label>Category<select name="category"><option value="perfume">Perfume</option><option value="attar">Attar</option></select></label><label>Size, e.g. 50 ml<input name="size"></label><label>Price in BDT (leave blank if unconfirmed)<input type="number" min="0" step="0.01" name="price_bdt"></label><label>English description<textarea name="description_en"></textarea></label><label>বাংলা বিবরণ<textarea name="description_bn"></textarea></label><label>Image URL<input type="url" name="image_url"></label><label>Or upload image<input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label><label><input type="checkbox" name="in_stock" style="width:auto"> In stock</label><label><input type="checkbox" name="published" style="width:auto"> Published</label><button class="gold-button">Save product</button> <button type="button" id="reset" class="outline">New product</button></form><h2>Products</h2><div id="list"></div></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
