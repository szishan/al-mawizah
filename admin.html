<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Studio | Al Mawizah</title><script src="theme.js"></script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body><header><a class="brand" href="index.html">AL MAWIZAH <small>ADMIN STUDIO</small></a><nav><a href="index.html" data-en="View shop" data-bn="দোকান দেখুন">View shop</a><button type="button" id="lang">বাংলা</button><button type="button" id="themeToggle">Light mode</button></nav></header><main class="studio-shell"><div class="studio-title"><div><span class="eyebrow">AL MAWIZAH</span><h1>Admin Studio</h1><p data-en="Manage your fragrance collection." data-bn="আপনার সুবাসের সংগ্রহ পরিচালনা করুন।">Manage your fragrance collection.</p></div><button id="logout" class="outline" type="button" hidden data-en="Sign out" data-bn="সাইন আউট">Sign out</button></div><p id="status" role="status" aria-live="polite"></p><form id="login" class="panel"><h2 data-en="Sign in" data-bn="সাইন ইন">Sign in</h2><label>Email / ইমেইল<input type="email" name="email" required autocomplete="username"></label><label>Password / পাসওয়ার্ড<input type="password" name="password" required autocomplete="current-password"></label><button class="gold-button" data-en="Sign in" data-bn="সাইন ইন">Sign in</button></form><section id="studio" hidden><div class="toolbar"><div><h2 data-en="Products" data-bn="পণ্যসমূহ">Products</h2><p id="productCount"></p></div><button id="newProduct" type="button" class="gold-button" data-en="New product" data-bn="নতুন পণ্য">New product</button></div><div class="filters admin-filters"><input id="searchProducts" type="search" placeholder="Search name or SKU" aria-label="Search products"><select id="filterBrand" aria-label="Brand"><option value="">All brands</option></select><select id="filterCategory" aria-label="Category"><option value="">All categories</option><option value="perfume">Perfume</option><option value="attar">Attar</option><option value="perfume_oil">Perfume Oil</option><option value="gift_set">Gift Set</option><option value="decant">Decant</option></select><select id="filterGender" aria-label="Gender"><option value="">All genders</option><option value="men">Men</option><option value="women">Women</option><option value="unisex">Unisex</option></select><select id="filterStock" aria-label="Stock"><option value="">All stock</option><option value="in_stock">In Stock</option><option value="out_of_stock">Out of Stock</option><option value="pre_order">Pre-order</option></select></div><div class="bulk"><label><input type="checkbox" id="selectAll"> <span data-en="Select visible" data-bn="দৃশ্যমান সব নির্বাচন">Select visible</span></label><select id="bulkAction"><option value="">Bulk action</option><option value="draft">Move to draft</option><option value="published">Publish</option><option value="archived">Archive</option><option value="delete">Delete</option></select><button type="button" id="applyBulk" class="outline">Apply</button></div><div id="list" class="product-list"></div><section id="editorPanel" class="panel" hidden><div class="toolbar"><h2 id="editorTitle">Product editor</h2><button type="button" id="cancelEdit" class="outline" data-en="Close" data-bn="বন্ধ">Close</button></div><form id="editor" novalidate><input type="hidden" name="id"><div id="fields"></div><fieldset><legend>Images / ছবি</legend><p class="hint">JPG, PNG, WebP · maximum 5 MB each. First image is the main image.</p><label>Upload images / ছবি আপলোড<input type="file" id="images" accept="image/jpeg,image/png,image/webp" multiple></label><div id="gallery" class="gallery"></div></fieldset><fieldset><legend>Size variants / সাইজ</legend><div id="variants"></div><button id="addVariant" class="outline" type="button">Add size variant / সাইজ যোগ করুন</button></fieldset><p id="editorStatus" role="status" aria-live="polite"></p><p id="profitMargin" class="hint" aria-live="polite"></p><div class="form-actions"><button class="gold-button" id="saveProduct" type="submit" data-en="Save product" data-bn="পণ্য সংরক্ষণ">Save product</button><button type="button" class="outline" id="previewProduct" data-en="Preview" data-bn="প্রিভিউ">Preview</button><button type="button" class="outline" id="reset" data-en="New product" data-bn="নতুন পণ্য">New product</button></div></form></section></section></main><dialog id="preview"><button type="button" class="close" aria-label="Close">×</button><div id="previewContent"></div></dialog><script src="config.js"></script><script src="admin.js"></script></body></html>
